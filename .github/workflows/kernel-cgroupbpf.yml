name: Kernel CGROUP_BPF + netfilter + a5xx v8 multi-ring preemption (mi6)

# 目标：只编译 linux-postmarketos-qcom-msm8998 内核包，并打开 CONFIG_CGROUP_BPF=y
# 不动 rootfs、不做整机 install、不刷 TWRP zip。
# 产物：内核 apk + 构建时实际使用的 config + 构建日志
#
# v2 相对 v1 的两处修正（依据 run 42223382455 的日志）：
#   1. apk 里只有 boot/Image、boot/dtbs/**、boot/System.map-<ver>，不存在 boot/config*，
#      v1 的校验步骤必然失败；而它排在上传之前，导致 29 分 41 秒编出的 apk 被丢掉。
#      现在改成「先上传产物、再校验」，且校验改为非致命 + 以构建时 config 为证据。
#   2. pmbootstrap v3.9.0 默认启用 ccache（--no-ccache 才是关闭），缓存目录是
#      $WORK/cache_ccache_x86_64（交叉编译在 x86_64 chroot 内进行，故按 x86_64 命名），
#      另有 $WORK/cache_sccache。v1 没有跨 run 持久化，等于每次冷编译（实测 29m41s）。
#      现在用 actions/cache 复用，重跑可直接命中。

on:
  push:
    branches: [kernel-cgroupbpf]
    paths:
      - '.github/workflows/kernel-cgroupbpf.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AARCH: aarch64
  KPKG: linux-postmarketos-qcom-msm8998
  DEVICE: xiaomi-sagit
  # 钉到 2026-01-23：设备上现有内核是 6.0-r3，与该日期的 pmaports/pmbootstrap 同期，
  # 保证编出来的是同一个源码树，只多一个 CONFIG_CGROUP_BPF=y。
  PIN: "2026-01-23"
  PMB_WORK: /home/runner/.local/var/pmbootstrap
  CCACHE_DIR: /home/runner/.local/var/pmbootstrap/cache_ccache_x86_64
  SCCACHE_DIR: /home/runner/.local/var/pmbootstrap/cache_sccache

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 1. 清理磁盘并查看空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: 2. 安装基础依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3 openssl
          git --version
          python3 --version

      - name: 3. 恢复 ccache（跨 run 复用内核编译产物）
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.SCCACHE_DIR }}
          # run_id 后缀保证每次都能存一份新的，避免精确命中后跳过保存；
          # restore-keys 让下一次 run 先找同 PIN 的旧缓存。
          key: ccache-${{ env.KPKG }}-${{ env.PIN }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.KPKG }}-${{ env.PIN }}-
            ccache-${{ env.KPKG }}-

      - name: 3.5 修正 ccache 属主（actions/cache 恢复出来是 runner，chroot 内编译用户是 pmos uid 12345）
        run: |
          echo "=== 恢复后属主（前5项）==="
          ls -ld "$CCACHE_DIR" 2>/dev/null || true
          sudo chown -R 12345:12345 "$CCACHE_DIR" 2>/dev/null || echo "chown 跳过"
          sudo chown -R 12345:12345 "$SCCACHE_DIR" 2>/dev/null || true
          echo "=== 修正后属主 ==="
          ls -ld "$CCACHE_DIR" 2>/dev/null || true
          du -sh "$CCACHE_DIR" 2>/dev/null || true

      - name: 4. 克隆 pmbootstrap（钉到 PIN 日期）
        run: |
          set -eux
          cd "$HOME"
          git clone --filter=blob:none https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          cd pmbootstrap
          SHA=$(git rev-list -1 --before="$PIN 23:59:59" --all)
          echo "pmbootstrap pin sha: $SHA"
          git checkout --quiet "$SHA"
          git log -1 --format='%H %ad %s'
          chmod +x pmbootstrap.py
          sudo ln -sf "$PWD/pmbootstrap.py" /usr/local/bin/pmbootstrap
          pmbootstrap --version

      - name: 5. 克隆 pmaports（钉到 PIN 日期）
        run: |
          set -eux
          mkdir -p "$PMB_WORK/cache_git"
          git clone --filter=blob:none https://gitlab.postmarketos.org/postMarketOS/pmaports.git "$PMB_WORK/cache_git/pmaports"
          cd "$PMB_WORK/cache_git/pmaports"
          DEFAULT=$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||' || true)
          if [ -z "${DEFAULT:-}" ]; then DEFAULT=main; fi
          echo "pmaports default branch: $DEFAULT"
          SHA=$(git rev-list -1 --before="$PIN 23:59:59" "origin/$DEFAULT")
          echo "pmaports pin sha: $SHA"
          # pmbootstrap 3.9.0 会读 origin/master 里的 channels.cfg，而 pmaports 已把
          # 默认分支改名为 main，所以必须显式造出 origin/master 这个引用。
          git update-ref refs/remotes/origin/master "$SHA"
          git update-ref "refs/remotes/origin/$DEFAULT" "$SHA"
          git checkout --quiet -B master "$SHA"
          git log -1 --format='%H %ad %s'
          echo "--- channels.cfg 前几行 ---"
          git show master:channels.cfg | head -5

      - name: 6. 生成 pmbootstrap 配置（非交互，work_version 动态读取）
        run: |
          set -eux
          mkdir -p "$HOME/.config" "$PMB_WORK"
          {
            printf '[pmbootstrap]\n'
            printf 'device = %s\n' "$DEVICE"
            printf 'ui = console\n'
            printf 'work = %s\n' "$PMB_WORK"
            printf 'hostname = mi6\n'
            printf 'user = user\n'
            printf 'systemd = default\n'
            printf 'is_default_channel = False\n'
            printf 'aports = %s\n' "$PMB_WORK/cache_git/pmaports"
          } > "$HOME/.config/pmbootstrap_v3.cfg"
          WV=$(grep -rhoiE 'work_version[[:space:]]*[:=][[:space:]]*[0-9]+' "$HOME/pmbootstrap/pmb/" | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "${WV:-}" ]; then WV=8; fi
          echo "$WV" > "$PMB_WORK/version"
          echo "work_version=$WV"
          cat "$HOME/.config/pmbootstrap_v3.cfg"
          git -C "$PMB_WORK/cache_git/pmaports" status --porcelain | head || true

      - name: 7. 定位内核 aport 并打开 CONFIG_CGROUP_BPF
        run: |
          set -eux
          APORTS="$PMB_WORK/cache_git/pmaports"
          KDIR=$(find "$APORTS" -maxdepth 3 -type d -name "$KPKG" | head -1)
          echo "kernel aport dir: $KDIR"
          ls -la "$KDIR"
          echo "--- APKBUILD 版本信息 ---"
          grep -E '^(pkgname|pkgver|pkgrel|arch)=' "$KDIR/APKBUILD" || true
          CFG=$(ls "$KDIR"/config-*"$AARCH" 2>/dev/null | head -1 || true)
          echo "config file: ${CFG:-<none>}"
          if [ -z "${CFG:-}" ]; then
            echo "FATAL: 找不到 config-*aarch64，APKBUILD 可能用别的配置来源" >&2
            grep -nE 'config|defconfig|kconfig' "$KDIR/APKBUILD" | head -20 >&2
            exit 1
          fi
          echo "--- 修改前 ---"
          grep -nE 'CONFIG_(CGROUP_BPF|CGROUP_DEVICE|CGROUP_SCHED|BPF_SYSCALL|BPF_JIT)\b' "$CFG" || echo "(no match)"
          sed -i 's/^# CONFIG_CGROUP_BPF is not set$/CONFIG_CGROUP_BPF=y/' "$CFG"
          grep -q '^CONFIG_CGROUP_BPF=y' "$CFG" || echo 'CONFIG_CGROUP_BPF=y' >> "$CFG"
          for o in CONFIG_CGROUP_SCHED CONFIG_CGROUP_DEVICE CONFIG_BPF_SYSCALL CONFIG_BPF_JIT; do
            if ! grep -q "^$o=y" "$CFG"; then
              sed -i "s/^# $o is not set$/$o=y/" "$CFG"
              grep -q "^$o=y" "$CFG" || echo "$o=y" >> "$CFG"
            fi
          done
          echo "--- 修改后 ---"
          grep -nE 'CONFIG_(CGROUP_BPF|CGROUP_DEVICE|CGROUP_SCHED|BPF_SYSCALL|BPF_JIT)\b' "$CFG"

          # ------------------------------------------------------------------
          # netfilter 补全：设备现状（6.0.0 #4）实测缺失项，按模块逐个补
          # 判据：zcat /proc/config.gz 逐项比对；符号名已核对到 6.0 源码 Kconfig
          #   注意 set 的 match/target 合并在 NETFILTER_XT_SET，没有 MATCH_SET
          # ------------------------------------------------------------------
          set_sym() {   # $1=CONFIG_X  $2=y|m|整数
            sym="$1"; val="$2"
            if grep -qE "^${sym}=" "$CFG"; then
              sed -i -E "s|^${sym}=.*|${sym}=${val}|" "$CFG"
            elif grep -qE "^# ${sym} is not set" "$CFG"; then
              sed -i -E "s|^# ${sym} is not set|${sym}=${val}|" "$CFG"
            else
              echo "${sym}=${val}" >> "$CFG"
            fi
          }

          # P0 docker 29 的 iptables 链路需要 raw 表
          set_sym CONFIG_IP_NF_RAW m
          set_sym CONFIG_IP6_NF_RAW m
          # P1 nftables 后端兼容层
          set_sym CONFIG_NFT_COMPAT m
          set_sym CONFIG_NF_TABLES_BRIDGE m
          # P2 面板 / fail2ban / 透明代理 / ipset 常用 match
          set_sym CONFIG_NETFILTER_XT_MATCH_MULTIPORT m
          set_sym CONFIG_NETFILTER_XT_MATCH_LIMIT m
          set_sym CONFIG_NETFILTER_XT_MATCH_OWNER m
          set_sym CONFIG_NETFILTER_XT_MATCH_IPRANGE m
          set_sym CONFIG_NETFILTER_XT_MATCH_MARK m
          set_sym CONFIG_NETFILTER_XT_MATCH_STATE m
          set_sym CONFIG_NETFILTER_XT_TARGET_LOG m
          set_sym CONFIG_IP_SET m
          set_sym CONFIG_IP_SET_MAX 256
          set_sym CONFIG_IP_SET_HASH_IP m
          set_sym CONFIG_IP_SET_HASH_NET m
          set_sym CONFIG_NETFILTER_XT_SET m
          set_sym CONFIG_NETFILTER_XT_TARGET_TPROXY m
          set_sym CONFIG_NETFILTER_XT_MATCH_SOCKET m
          set_sym CONFIG_NF_TPROXY_IPV4 m
          set_sym CONFIG_NF_TPROXY_IPV6 m
          set_sym CONFIG_NF_CONNTRACK_PROCFS y
          set_sym CONFIG_NF_CONNTRACK_EVENTS y
          # P3 可选：zram 切 zstd（ZSTD_COMPRESS 由 CRYPTO_ZSTD 的 select 带出）
          set_sym CONFIG_CRYPTO_ZSTD m
          set_sym CONFIG_ZRAM_WRITEBACK m
          set_sym CONFIG_NET_SCH_NETEM m

          echo "--- netfilter 补全后 ---"
          for s in IP_NF_RAW IP6_NF_RAW NFT_COMPAT NF_TABLES_BRIDGE NETFILTER_XT_SET \
                   NETFILTER_XT_MATCH_MULTIPORT NETFILTER_XT_MATCH_MARK NETFILTER_XT_MATCH_STATE \
                   IP_SET NETFILTER_XT_TARGET_TPROXY NETFILTER_XT_MATCH_SOCKET \
                   NF_TPROXY_IPV4 NF_TPROXY_IPV6 CRYPTO_ZSTD; do
            grep -E "^(CONFIG_$s=|# CONFIG_$s is not set)" "$CFG" || echo "CONFIG_$s=<缺>"
          done

          # 留一份改后的 config 作为「构建实际使用了什么」的证据（apk 内不含 config）
          cp "$CFG" "$GITHUB_WORKSPACE/kernel-config-modified.aarch64"
          # APKBUILD 的 sha512sums 里含该 config 文件的校验和，改了 config 必须同步更新，
          # 否则 abuild 会以 "FAILED (checked 1 checksum)" 直接中止。
          NEWHASH=$(sha512sum "$CFG" | cut -d' ' -f1)
          CFGNAME=$(basename "$CFG")
          sed -i -E "s|^([[:space:]]*)[0-9a-f]{128}([[:space:]]+${CFGNAME})[[:space:]]*\$|\1${NEWHASH}\2|" "$KDIR/APKBUILD"
          echo "new config sha512: $NEWHASH"
          echo "--- APKBUILD 中该行 ---"
          grep -n "${CFGNAME}" "$KDIR/APKBUILD"
          grep -q "${NEWHASH}" "$KDIR/APKBUILD" || { echo "FATAL: 未能更新 APKBUILD 校验和" >&2; exit 1; }
          cd "$APORTS"
          git add -A
          git -c user.name="ci" -c user.email="ci@localhost" commit -m "kernel: enable CONFIG_CGROUP_BPF for $KPKG" || echo "no change to commit (config already has CONFIG_CGROUP_BPF=y)"
          git log --oneline -1
          git status --porcelain | head || true

      - name: 7.5 注入 mi6 a5xx GPU 补丁（patch 落 /mnt/pmaports + build() 首行应用）
        run: |
          set -eux
          APORTS="$PMB_WORK/cache_git/pmaports"
          KDIR=$(find "$APORTS" -maxdepth 3 -type d -name "$KPKG" | head -1)
          echo "kernel aport dir: $KDIR"
          echo '' | base64 -d > "$KDIR/mi6-gpu.patch"
          wc -l "$KDIR/mi6-gpu.patch"
          grep -c -e '^--- a/' "$KDIR/mi6-gpu.patch" || { echo "FATAL: patch 解码不完整" >&2; exit 1; }
          PATCH_IN_CHROOT="/mnt/pmaports${KDIR#$APORTS}/mi6-gpu.patch"
          echo "patch in chroot: $PATCH_IN_CHROOT"
          grep -n '^build() {' "$KDIR/APKBUILD"
          cp "$KDIR/APKBUILD" /tmp/APKBUILD.before
          export MI6_LINE="    A5XX=\$(find /home/pmos/build -name a5xx_gpu.c -path '*drm/msm/adreno*' | head -1); SRCROOT=\$(dirname \$A5XX)/../../../../..; echo MI6 srcroot=\$SRCROOT; patch -p1 -d \$SRCROOT -i "$PATCH_IN_CHROOT" || exit 1; grep -c a5xx_nr_rings \$SRCROOT/drivers/gpu/drm/msm/adreno/a5xx_gpu.c; grep -c a5xx_preempt_pkts \$SRCROOT/drivers/gpu/drm/msm/adreno/a5xx_gpu.c; grep -c 'if (preempt)' \$SRCROOT/drivers/gpu/drm/msm/adreno/a5xx_gpu.c; grep -c 'static int a5xx_pp_as = 1' \$SRCROOT/drivers/gpu/drm/msm/adreno/a5xx_gpu.c; grep -c 'static int a5xx_nr_rings = 4' \$SRCROOT/drivers/gpu/drm/msm/adreno/a5xx_gpu.c; grep -c 'static int a5xx_whereami = -1' \$SRCROOT/drivers/gpu/drm/msm/adreno/a5xx_gpu.c"
          echo "MI6_LINE=$MI6_LINE"
          awk '{print} /^build\(\) \{/ && !d {print ENVIRON["MI6_LINE"]; d=1}' /tmp/APKBUILD.before > "$KDIR/APKBUILD"
          grep -c 'MI6 srcroot' "$KDIR/APKBUILD" || { echo "FATAL: 未能插入 build()" >&2; exit 1; }
          diff -u /tmp/APKBUILD.before "$KDIR/APKBUILD" | cut -c1-200 || true
          cd "$APORTS"
          git add -A
          git -c user.name="ci" -c user.email="ci@localhost" commit -m "mi6: a5xx gpu patch" || true

      - name: 8. 编译内核包
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          echo "=== 编译前 ccache 状态（命中 restore 时非空）==="
          du -sh "$CCACHE_DIR" 2>/dev/null || echo "ccache dir 不存在（冷缓存）"
          pmbootstrap --details-to-stdout build "$KPKG" 2>&1 | tee build.log
          echo "=== 产物 ==="
          find "$PMB_WORK/packages" -name "$KPKG-*.apk" -printf '%p  %s bytes\n'
          echo "=== 编译后 ccache 体积 ==="
          du -sh "$CCACHE_DIR" 2>/dev/null || true

      - name: 8.5 ccache 统计（判断下一次能否命中，命中则编译时间应大幅下降）
        if: always()
        run: |
          echo "=== ccache 目录体积 ==="
          du -sh "$CCACHE_DIR" 2>/dev/null || echo "ccache dir 缺失"
          du -sh "$SCCACHE_DIR" 2>/dev/null || true
          echo "=== pmbootstrap stats（chroot 内 ccache -s）==="
          pmbootstrap stats 2>&1 | tail -40 || true

      - name: 9. 上传内核 apk 与 config（先于校验，失败也要拿到产物）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-cgroupbpf
          path: |
            /home/runner/.local/var/pmbootstrap/packages/**/${{ env.KPKG }}-*.apk
            kernel-config-modified.aarch64
            build.log
          if-no-files-found: error
          retention-days: 30

      - name: 10. 校验（非致命：该内核包不含 boot/config，以构建时 config 为证据）
        run: |
          set -ux
          PKG=$(find "$PMB_WORK/packages" -name "$KPKG-*.apk" -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          echo "apk: ${PKG:-<none>}"
          tar -tzf "$PKG" 2>/dev/null | grep -E '^boot/' | head -30
          echo "--- apk 内 Image/dtbs/System.map ---"
          tar -tzf "$PKG" 2>/dev/null | grep -E '^boot/(Image|vmlinuz|System\.map)' | head -10
          CFGPATH=$(tar -tzf "$PKG" 2>/dev/null | grep -E 'boot/config' | head -1)
          if [ -n "${CFGPATH:-}" ]; then
            echo "apk 内含 config: $CFGPATH"
            tar -xzOf "$PKG" "$CFGPATH" > out.config
            grep -E '^CONFIG_CGROUP_BPF=' out.config
          else
            echo "NOTE: apk 内不含 boot/config*（该 aport 的 package() 只装 Image/dtbs/System.map）"
            echo "改为校验构建时实际使用的 config 文件："
            grep -E '^CONFIG_(CGROUP_BPF|CGROUP_DEVICE|BPF_SYSCALL)=' kernel-config-modified.aarch64 || true
            grep -q '^CONFIG_CGROUP_BPF=y' kernel-config-modified.aarch64 \
              && echo "VERIFY OK (config): CONFIG_CGROUP_BPF=y" \
              || echo "::error::构建用 config 里没有 CONFIG_CGROUP_BPF=y"
          fi
          echo "--- 最终以设备实测为准：装包重启后 zcat /proc/config.gz | grep CGROUP_BPF ---"
          echo "=== 模块落地校验（真实 ground truth：olddefconfig 丢掉无效符号时这里会缺） ==="
          TMPD=$(mktemp -d)
          tar -xzf "$PKG" -C "$TMPD" 2>/dev/null || true
          KOS=$(find "$TMPD" -name '*.ko' -o -name '*.ko.*' 2>/dev/null | wc -l)
          echo "apk 内 .ko 总数: $KOS"
          MISS=""
          for m in iptable_raw ip6table_raw nft_compat nf_tables_bridge \
                   xt_multiport xt_limit xt_owner xt_iprange xt_mark xt_state xt_LOG \
                   ip_set ip_set_hash_ip ip_set_hash_net xt_set \
                   xt_TPROXY xt_socket nf_tproxy_ipv4 nf_tproxy_ipv6 \
                   crypto_zstd zram netem; do
            if find "$TMPD" -name "${m}.ko*" | grep -q .; then
              echo "  OK   $m"
            else
              echo "::warning:: 缺模块 $m"
              MISS="$MISS $m"
            fi
          done
          if [ -n "$MISS" ]; then
            echo "::error::以下模块未生成（符号被 olddefconfig 丢弃或依赖未满足）:$MISS"
          else
            echo "VERIFY OK: 全部目标模块均已生成"
          fi
          rm -rf "$TMPD"

      - name: 11. 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: |
            build.log
            /home/runner/.local/var/pmbootstrap/log.txt
          if-no-files-found: ignore
          retention-days: 7
